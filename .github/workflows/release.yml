name: Release

# Push a tag that matches Support/Info.plist (e.g. v0.1.0) to publish AgentScope-<version>.zip
# as a GitHub release and point Casks/agentscope.rb on main at it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag matches Info.plist
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Support/Info.plist)
          if [[ "v$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Info.plist version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build release zip
        run: |
          scripts/release.sh
          echo "SHA=$(shasum -a 256 "dist/AgentScope-$VERSION.zip" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/AgentScope-$VERSION.zip" \
            --title "AgentScope $VERSION" --generate-notes

      - name: Update cask on main
        run: |
          git switch main
          sed -i '' -e "s/^  version \".*\"/  version \"$VERSION\"/" \
                    -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/agentscope.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Cask: AgentScope $VERSION" || exit 0
          git push origin main
